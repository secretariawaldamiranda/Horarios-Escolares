<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horário Escolar 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f5; --bg3: #ebebeb;
    --text: #1a1a1a; --text2: #666; --text3: #999;
    --border: #e0e0e0; --row-active: #fffbe6; --row-active-text: #854F0B;
    --badge-now-bg: #FAC775; --badge-now-text: #633806;
    --tab-active-bg: #e6f1fb; --tab-active-text: #0c447c;
  }
  .dark {
    --bg: #1a1a1a; --bg2: #252525; --bg3: #303030;
    --text: #f0f0f0; --text2: #aaa; --text3: #777;
    --border: #3a3a3a; --row-active: #332d00; --row-active-text: #FAC775;
    --badge-now-bg: #633806; --badge-now-text: #FAC775;
    --tab-active-bg: #0c447c; --tab-active-text: #e6f1fb;
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; transition: background 0.3s, color 0.3s; }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; color: var(--text); }
  .top-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem; align-items: center; }
  .label { font-size: 13px; color: var(--text2); }
  select { min-width: 130px; padding: 6px 10px; font-size: 13px; border: 0.5px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--text); cursor: pointer; }
  .day-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
  .tab { padding: 5px 14px; font-size: 13px; border-radius: 8px; border: 0.5px solid var(--border); cursor: pointer; background: transparent; color: var(--text2); transition: background 0.15s; }
  .tab.active { background: var(--tab-active-bg); color: var(--tab-active-text); border-color: transparent; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg2); color: var(--text2); font-weight: 500; padding: 8px 10px; text-align: left; border-bottom: 0.5px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); vertical-align: middle; transition: background 0.3s; }
  tr.active-row td { background: var(--row-active); }
  tr.active-row td.aula-num,
  tr.active-row td.time-col { color: var(--row-active-text); font-weight: 700; }
  .aula-num { font-weight: 500; color: var(--text3); font-size: 12px; }
  .time-col { font-size: 12px; color: var(--text3); min-width: 70px; }
  .subject-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .now-badge { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 500; background: var(--badge-now-bg); color: var(--badge-now-text); vertical-align: middle; }
  .mode-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
  .mode-btn { padding: 5px 14px; font-size: 13px; border-radius: 8px; border: 0.5px solid var(--border); cursor: pointer; background: transparent; color: var(--text2); }
  .mode-btn.active { background: var(--bg3); color: var(--text); font-weight: 500; }
  .clock { font-size: 13px; color: var(--text2); margin-left: auto; font-variant-numeric: tabular-nums; }
  .dark-toggle { padding: 5px 12px; font-size: 13px; border-radius: 8px; border: 0.5px solid var(--border); cursor: pointer; background: transparent; color: var(--text2); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div class="container">
  <h1>Horário escolar 2026</h1>
  <div class="top-bar">
    <span class="label">Turma:</span>
    <select id="turma-sel">
      <option value="6A">6º Ano A</option>
      <option value="6B">6º Ano B</option>
      <option value="7A">7º Ano A</option>
      <option value="7B">7º Ano B</option>
      <option value="8A">8º Ano A</option>
      <option value="8B">8º Ano B</option>
      <option value="9A">9º Ano A</option>
      <option value="9B">9º Ano B</option>
    </select>
    <span class="label">Horário:</span>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('normal',this)">Normal (48 min)</button>
      <button class="mode-btn" onclick="setMode('reduzido',this)">Reduzido (36 min)</button>
      <button class="mode-btn" onclick="setMode('930',this)">Até 09:30</button>
    </div>
    <button class="dark-toggle" id="dark-btn" onclick="toggleDark()">🌙 Escuro</button>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="day-tabs" id="day-tabs"></div>
  <div class="legend" id="legend"></div>
  <div id="table-container"></div>
</div>

<script>
const DIAS = ["2ª Feira","3ª Feira","4ª Feira","5ª Feira","6ª Feira"];

const HORARIOS = {
  normal:   ["07:30","08:18","09:06","09:54","10:42","11:30"],
  reduzido: ["07:30","08:06","08:42","09:18","09:54","10:30"],
  "930":    ["07:30","08:10","08:50","09:30","—","—"]
};

const PROF_COLORS = {
  "Nilmar":   { l:"#EEEDFE", d:"#2a2060", tl:"#3C3489", td:"#c8c3f8" },
  "Islara":   { l:"#E6F1FB", d:"#0a2d50", tl:"#0C447C", td:"#90c4f0" },
  "Alex":     { l:"#E1F5EE", d:"#04342C", tl:"#085041", td:"#6fd4b0" },
  "Ismênia":    { l:"#FAEEDA", d:"#412402", tl:"#633806", td:"#f5c97a" },
  "Ludmilla": { l:"#EAF3DE", d:"#173404", tl:"#27500A", td:"#a8d96a" },
  "Delzeni":  { l:"#FCEBEB", d:"#500d0d", tl:"#791F1F", td:"#f5a0a0" },
  "Eldira":   { l:"#FFF0E6", d:"#3d1800", tl:"#993300", td:"#ffb07a" },
  "Thalita":  { l:"#FBEAF0", d:"#4b1528", tl:"#72243E", td:"#f0a0c0" },
  "Eder":     { l:"#E8F4F8", d:"#0a2535", tl:"#1a5276", td:"#7ec8e3" },
  "default":  { l:"#F1EFE8", d:"#2a2a2a", tl:"#444441", td:"#aaa" }
};

function getProfName(subj) {
  const first = subj.split(" ")[0];
  return PROF_COLORS[first] ? first : "default";
}

function getBadgeColors(subj) {
  const key = getProfName(subj);
  const c = PROF_COLORS[key];
  return { bg: isDark ? c.d : c.l, color: isDark ? c.td : c.tl };
}

const RAW = {
  "2ª Feira": {
    "6A":  ["Nilmar hist.","Islara Arte","Alex Geog.","Islara Port.","Ludmilla Ciências"],
    "6B":  ["Ismênia Ed. Fís.","Thalita Mat.","Islara Port.","Ludmilla Ciências","Nilmar hist."],
    "7A":  ["Ludmilla Ciências","Ismênia Ed. Fís.","Thalita Mat.","Nilmar hist.","Islara Port."],
    "7B":  ["Islara Arte","Ludmilla Ciências","Ismênia Ed. Fís.","Eldira Port.","Delzeni mat."],
    "8A":  ["Thalita Religião","Nilmar hist.","Ludmilla Ciências","Delzeni mat.","Eldira Port."],
    "8B":  ["Delzeni mat.","Alex Geog.","Eldira Port.","Ismênia Ed. Fís.","Eder Inglês"],
    "9A":  ["Eldira Port.","Delzeni mat.","Nilmar hist.","Alex Geog.","Ismênia Ed. Fís."],
    "9B":  ["Alex Geog.","Eldira Port.","Delzeni mat.","Eder Inglês","Thalita Religião"]
  },
  "3ª Feira": {
    "6A":  ["Alex Geog.","Thalita Mat.","Ismênia Inglês","Thalita Mat.","Islara Port."],
    "6B":  ["Thalita Mat.","Alex Geog.","Islara Arte","Ismênia Inglês","Thalita Mat."],
    "7A":  ["Islara Arte","Ludmilla Ciências","Nilmar hist.","Alex Geog.","Ismênia Inglês"],
    "7B":  ["Delzeni mat.","Nilmar hist.","Alex Geog.","Ludmilla Ciências","Eldira Port."],
    "8A":  ["Ismênia Ed. Fís.","Islara Arte","Delzeni mat.","Eldira Port.","Alex Geog."],
    "8B":  ["Nilmar hist.","Delzeni mat.","Eldira Port.","Islara Arte","Ludmilla Ciências"],
    "9A":  ["Ludmilla Ciências","Eldira Port.","Thalita Religião","Delzeni mat.","Nilmar hist."],
    "9B":  ["Eldira Port.","Ismênia Ed. Fís.","Ludmilla Ciências","Nilmar hist.","Delzeni mat."]
  },
  "4ª Feira": {
    "6A":  ["Ludmilla Ciências","Nilmar hist.","Alex Geog.","Thalita Mat.","Islara Port."],
    "6B":  ["Alex Geog.","Ismênia Inglês","Nilmar hist.","Islara Port.","Thalita Religião"],
    "7A":  ["Ismênia Ed. Fís.","Thalita Mat.","Thalita Mat.","Nilmar hist.","Ludmilla Ciências"],
    "7B":  ["Thalita Religião","Delzeni mat.","Ismênia Ed. Fís.","Alex Geog.","Eldira Port."],
    "8A":  ["Eldira Port.","Alex Geog.","Delzeni mat.","Ludmilla Ciências","Ismênia Inglês"],
    "8B":  ["Nilmar hist.","Ludmilla Ciências","Eldira Port.","Delzeni mat.","Eder Inglês"],
    "9A":  ["Islara Arte","Eldira Port.","Eder Inglês","Ismênia Ed. Fís.","Delzeni mat."],
    "9B":  ["Delzeni mat.","Islara Arte","Ludmilla Ciências","Eldira Port.","Alex Geog."]
  },
  "5ª Feira": {
    "6A":  ["Nilmar hist.","Islara Port.","Ludmilla Ciências","Thalita Mat.","Thalita Ed. Fis."],
    "6B":  ["Thalita Mat.","Ludmilla Ciências","Islara Port.","Nilmar hist.","Islara Port."],
    "7A":  ["Islara Port.","Thalita Mat.","Thalita Religião","Islara Port.","Alex Geog."],
    "7B":  ["Delzeni mat.","Ismênia Inglês","Nilmar hist.","Alex Geog.","Eldira Port."],
    "8A":  ["Alex Geog.","Delzeni mat.","Ismênia Ed. Fís.","Eldira Port.","Nilmar hist."],
    "8B":  ["Eldira Port.","Alex Geog.","Delzeni mat.","Ludmilla Ciências","Ismênia Ed. Fís."],
    "9A":  ["Ludmilla Ciências","Eldira Port.","Alex Geog.","Delzeni mat.","Eder Inglês"],
    "9B":  ["Ismênia Ed. Fís.","Nilmar hist.","Eldira Port.","Eder Inglês","Delzeni mat."]
  },
  "6ª Feira": {
    "6A":  ["Islara Religião","Ismênia Inglês","Thalita Mat.","Islara Port.","Thalita Ed. Fis."],
    "6B":  ["Ismênia Ed. Fís.","Alex Geog.","Islara Port.","Thalita Mat.","Ludmilla Ciências"],
    "7A":  ["Thalita Mat.","Islara Port.","Alex Geog.","Ismênia Inglês","Islara Port."],
    "7B":  ["Ludmilla Ciências","Delzeni mat.","Eldira Port.","Nilmar hist.","Ismênia Inglês"],
    "8A":  ["Delzeni mat.","Ludmilla Ciências","Ismênia Inglês","Eldira Port.","Nilmar hist."],
    "8B":  ["Nilmar hist.","Thalita Religião","Delzeni mat.","Alex Geog.","Eldira Port."],
    "9A":  ["Eldira Port.","Nilmar hist.","Ludmilla Ciências","Delzeni mat.","Alex Geog."],
    "9B":  ["Alex Geog.","Eldira Port.","Nilmar hist.","Ludmilla Ciências","Delzeni mat."]
  }
};

let currentMode = "normal";
let lastAula = -2;
let lastDay = "";
let isDark = false;

function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle("dark", isDark);
  document.getElementById("dark-btn").textContent = isDark ? "☀️ Claro" : "🌙 Escuro";
  lastAula = -2;
  render();
}

function toMin(str) {
  if (!str || str === "—") return null;
  const [h, m] = str.split(":").map(Number);
  return h * 60 + m;
}

function getCurrentAula(mode) {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const times = HORARIOS[mode];
  const maxAulas = mode === '930' ? 4 : 5;
  for (let i = 0; i < maxAulas; i++) {
    const start = toMin(times[i]);
    const end = toMin(times[i + 1]);
    if (start === null || end === null) continue;
    if (nowMin >= start && nowMin < end) return i;
  }
  return -1;
}

function getTodayDia() {
  const dow = new Date().getDay();
  const map = {1:"2ª Feira",2:"3ª Feira",3:"4ª Feira",4:"5ª Feira",5:"6ª Feira"};
  return map[dow] || null;
}

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  lastAula = -2;
  render();
}

function renderTabs() {
  const todayDia = getTodayDia();
  const container = document.getElementById('day-tabs');
  container.innerHTML = DIAS.map(d => {
    const isToday = d === todayDia;
    return `<button class="tab${d===currentDay?' active':''}" ${isToday?'style="font-weight:600"':''} onclick="selectDay('${d}',this)">${d}${isToday?' ●':''}</button>`;
  }).join('');
}

function selectDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  lastAula = -2;
  render();
}

const todayInit = getTodayDia();
let currentDay = todayInit || "2ª Feira";

function renderLegend() {
  const turma = document.getElementById('turma-sel').value;
  const profs = new Set();
  for (const dia of DIAS) {
    for (const subj of RAW[dia][turma]) profs.add(getProfName(subj));
  }
  const container = document.getElementById('legend');
  container.innerHTML = [...profs].map(p => {
    const c = PROF_COLORS[p] || PROF_COLORS.default;
    const bg = isDark ? c.d : c.l;
    const color = isDark ? c.td : c.tl;
    return `<span class="legend-item"><span class="legend-dot" style="background:${bg};border:1.5px solid ${color}"></span>${p === 'default' ? '?' : p}</span>`;
  }).join('');
}

function render() {
  const turma = document.getElementById('turma-sel').value;
  const aulas = RAW[currentDay][turma];
  const times = HORARIOS[currentMode];
  const maxAulas = currentMode === '930' ? 4 : 5;
  const todayDia = getTodayDia();
  const activeAula = (currentDay === todayDia) ? getCurrentAula(currentMode) : -1;

  renderLegend();

  let html = `<table>
    <thead><tr>
      <th style="width:40px">Aula</th>
      <th style="width:110px">Horário</th>
      <th>Professor(a) / Matéria</th>
    </tr></thead><tbody>`;

  for (let i = 0; i < maxAulas; i++) {
    const subj = aulas[i] || '—';
    const time = times[i];
    const endTime = times[i+1] || '';
    const c = getBadgeColors(subj);
    const isActive = i === activeAula;
    const timeStr = (endTime && endTime !== '—') ? `${time} – ${endTime}` : time;

    const badge = subj !== '—'
      ? `<span class="subject-badge" style="background:${c.bg};color:${c.color}">${subj}</span>${isActive ? '<span class="now-badge">agora</span>' : ''}`
      : `<span style="color:var(--text3);font-size:12px">sem aula</span>`;

    html += `<tr class="${isActive ? 'active-row' : ''}">
      <td class="aula-num">${i+1}ª</td>
      <td class="time-col">${timeStr}</td>
      <td>${badge}</td>
    </tr>`;
  }

  html += `</tbody></table>`;
  document.getElementById('table-container').innerHTML = html;
  lastAula = activeAula;
  lastDay = currentDay;
}

function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  const todayDia = getTodayDia();
  const activeAula = (currentDay === todayDia) ? getCurrentAula(currentMode) : -1;
  if (activeAula !== lastAula || currentDay !== lastDay) {
    render();
    renderTabs();
  }
}

document.getElementById('turma-sel').addEventListener('change', () => { lastAula = -2; render(); });

renderTabs();
render();
setInterval(tick, 1000);
</script>
</body>
</html>
